<!DOCTYPE html>
<html>
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'Coin';
      src: url('assets/lucky-coin-font/LuckyCoin-3zA46.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Crows Ink';
      src: url('assets/crows-ink-font/Crowsink-lxgl5.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    body {
      width: 320px;
      padding: 20px;
      font-family: 'Coin', Arial, sans-serif;
      margin: 0;
    }
    
    h1 {
      font-size: 24px;
      margin: 0 0 15px 0;
      color: #333;
    }
    
    h2 {
      font-size: 20px;
      margin: 20px 0 10px 0;
      color: #555;
    }
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    
    .toggle-label {
      font-size: 20px;
      color: #555;
      font-family: 'Sour Gummy', sans-serif;
    }
    
    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }
    
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #75c5f7;
    }
    
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    
    .status {
      text-align: center;
      padding: 10px;
      font-size: 18px;
      color: #666;
    }
    
    /* To do list styles */
    .todo-input-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }
    
    .input-row {
      display: flex;
      gap: 8px;
    }
    #todoInput {
      flex: 1;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: 'Sour Gummy', sans-serif;
    }
    .reminder-type-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    
    #reminderType {
      flex: 1;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: 'Sour Gummy', sans-serif;
    }

    #reminderTime {
      flex: 1;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;

    }
    #reminderInterval {
      flex: 1;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 15px;
      font-family: 'Sour Gummy', sans-serif;
    }
    
    #addTodoBtn {
      padding: 8px 16px;
      background: #75c5f7;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
      font-family: 'Coin', Arial, sans-serif;
    }

    #addTodoBtn:hover {
      background: #3f94c9;
    }

    .todo-list {
      max-height: 250px;
      overflow-y: auto;
      margin-top: 10px;
    }

    .todo-item {
      padding: 10px;
      background: #f9f9f9;
      border-radius: 4px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    
    .todo-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }
    
    .todo-text {
      flex: 1;
      font-weight: 500;
      color: #333;
    }

    .todo-reminder-info {
      font-size: 11px;
      color: #666;
      margin-bottom: 6px;
    }
    .delete-btn {
      background: #ff9e9e;
      color: white;
      border: none;
      border-radius: 3px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .delete-btn:hover {
      background: #d13434;
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: #999;
      font-size: 14px;
      font-family: 'Coin', Arial, sans-serif;
    }
    .hidden {
      display: none;
    }

    .cat-selector {
      margin: 15px 0;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 8px;
    }

    .cat-selector label {
      display: block;
      font-size: 14px;
      color: #555;
      margin-bottom: 8px;
    }

    #catBreed {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: 'Crows Ink', Arial, sans-serif;
    }
  </style>
</head>
<body>
  <h1>Desktop Cat</h1>
  
  <div class="toggle-container">
    <span class="toggle-label">Enable Cat</span>
    <label class="switch">
      <input type="checkbox" id="catToggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div class="status" id="status">Cat is active on all pages</div>

  <h2>Choose Your Cat!</h2>

  <div class="cat-selector">
    <label for="catBreed">Cat Species:</label>
    <select id="catBreed">
      <option value="ragdoll">Ragdoll</option>
      <option value="calico">Calico</option>
      <option value="orange">Orange</option>
      <option value="black">Black</option>
      <option value="tabby">Tabby</option>
    </select>
  </div>

  <h2>Reminders</h2>
  <div class="todo-input-container">
    <div class="input-row">
      <input type="text" id="todoInput" placeholder="Add a reminder!">
    </div>

    <div class="reminder-type-row">
      <select id="reminderType">
        <option value="interval">Repeat every...</option>
        <option value="time">At specific time</option>
      </select>

      <select id="reminderInterval">
        <option value="10">10 minutes</option>
        <option value="15">15 minutes</option>
        <option value="20">20 minutes</option>
        <option value="25">25 minutes</option>
        <option value="30">30 minutes</option>
        <option value="35">35 minutes</option>
        <option value="40">40 minutes</option>
        <option value="45">45 minutes</option>
        <option value="50">50 minutes</option>
        <option value="55">55 minutes</option>
        <option value="60">60 minutes</option>
      </select>

      <input type="time" id="reminderTime" class="hidden">

      <button id="addTodoBtn">Add</button>
    </div>
  </div>

  <div class="todo-list" id="todoList">
    <div class="empty-state">No reminders yet!</div>
  </div>
      
  
  <script src="popup.js"></script>
</body>
</html>
